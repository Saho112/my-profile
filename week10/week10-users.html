<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="bg-white p-6 rounded-xl shadow-md max-w-md mx-auto mt-10">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">GitHubユーザー情報表示ツール</h2>
        <form id="userForm" class="space-y-4" novalidate>
            <div>
                <label for="username" class="block text-gray-700 font-medium mb-1">GitHubのユーザー名:</label>
                <input type="text" id="username" name="username" placeholder="例: octocat" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 font-bold transition">検索</button>
        </form>
        <div id="resultMessage" class="mt-4 text-sm font-medium"></div>
        <div id="userInfo" class="mt-4"></div>
    </div>

    <script>
        const userForm = document.getElementById("userForm");
        const usernameInput = document.getElementById("username");
        const resultMessage = document.getElementById("resultMessage");
        const userInfo = document.getElementById("userInfo");
        
        userForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const username = usernameInput.value.trim();

            if (username === "") {
                resultMessage.textContent = "ユーザー名を入力してください。";
                resultMessage.className = "mt-4 text-sm text-red-600";
                userInfo.innerHTML = "";
                return;
            }

            resultMessage.textContent = "検索中...";
            resultMessage.className = "mt-4 text-sm text-blue-600";
            userInfo.innerHTML = "";

            // GitHub APIからデータを取得
            const data = await fetchGitHubUser(username);

            // ユーザーが見つからなかった場合（nullが返ってきた場合）
            if (!data) {
                resultMessage.textContent = "ユーザーが見つかりませんでした。";
                resultMessage.className = "mt-4 text-sm text-red-600";
                return;
            }

            // 成功時はメッセージをクリア
            resultMessage.textContent = "";

            // 取得したデータを画面に表示
            userInfo.innerHTML = `
                <div class="flex flex-col items-center bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-sm">
                    <img src="${data.avatar_url}" alt="アバター画像" class="w-24 h-24 rounded-full mb-4 shadow border-2 border-white">
                    <h3 class="text-xl font-bold text-gray-800 mb-1">${data.name ? data.name : "名前未設定"}</h3>
                    <p class="text-sm text-gray-500 mb-3">@${data.login}</p>
                    <p class="text-gray-700 text-center mb-4 text-sm leading-relaxed">${data.bio ? data.bio : "自己紹介文が設定されていません。"}</p>
                    <div class="text-sm text-gray-600 bg-white px-4 py-1.5 rounded-full border shadow-sm">
                        フォロワー数: <span class="font-bold text-blue-600">${data.followers}</span> 人
                    </div>
                </div>
            `;
        });

        async function fetchGitHubUser(username) {
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                
                // response.okで通信の成功を確認
                if (!response.ok) {
                    throw new Error("ユーザーが見つかりませんでした。");
                }
                
                const data = await response.json();
                
                // コンソールで取得したオブジェクトの中身を確認
                console.log("取得したGitHubデータ:", data);
                
                return data;
            } catch (error) {
                console.error(error);
                return null;
            }
        }
    </script>
</body>
</html>
